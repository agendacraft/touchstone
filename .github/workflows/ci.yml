name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: ${{ vars.TOUCHSTONE_EVALS != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
      - name: Replay evals and reject baseline regression
        run: |
          go build -o "$RUNNER_TEMP/touchstone" ./cmd/touchstone
          status=0
          "$RUNNER_TEMP/touchstone" eval --replay --baseline internal/eval/baseline.json > "$RUNNER_TEMP/eval.json" || status=$?
          # Exit 2 preserves known model incompleteness, only after baseline comparison.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
      - name: Replay bundled demo and reject output drift
        run: |
          go build -o "$RUNNER_TEMP/touchstone" ./cmd/touchstone
          "$RUNNER_TEMP/touchstone" demo --replay > "$RUNNER_TEMP/demo-output.txt"
          diff -u docs/demo-output.txt "$RUNNER_TEMP/demo-output.txt"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build -o "$RUNNER_TEMP/touchstone" ./cmd/touchstone
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Smoke test
        run: |
          "$RUNNER_TEMP/touchstone" version
          "$RUNNER_TEMP/touchstone" config validate --cwd .
          if "$RUNNER_TEMP/touchstone" review --concurrency 0; then
            echo "invalid review unexpectedly succeeded"
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
